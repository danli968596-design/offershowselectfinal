<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ddecfc">
  <meta name="description" content="把 2–6 份 Offer 放在一起，选一份适合自己的工作。">
  <title>OfferShow · Offer 帮选</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/variant-b.css" data-ui-variant-style>
  <link rel="stylesheet" href="styles/paper-blue-v5.css">
  <link rel="stylesheet" href="styles/ui-polish.css" data-ui-polish>
  <link rel="stylesheet" href="styles/home-brand-v5.css?v=distributed-steps-v3">
</head>
<body data-ui-variant="b" class="ui-minimal ui-paper-blue page-landing page-home-brand">
<header class="mini-home-header">
  <div class="mini-home-header__inner">
    <span class="mini-home-brand">OfferShow</span>
    <h1 aria-label="Offer 帮选"><span class="paper-title__offer" aria-hidden="true">Offer</span><span class="paper-title__choice" aria-hidden="true">帮选</span></h1>
    <p class="paper-ribbon">把选择摆在一起，慢慢看清楚</p>
  </div>
  <div class="home-brand-art" aria-hidden="true">
    <span class="home-brand-card home-brand-card--back"></span>
    <span class="home-brand-card home-brand-card--front"><span></span><span></span><span></span></span>
    <img src="assets/offershow-mascot-paper-v2.png" alt="" width="1313" height="1198" fetchpriority="high">
  </div>
</header>
<div class="app-shell">
  <main class="page-content" id="main-content">
    <div class="landing-actions">
      <a id="startFlowBtn" class="btn btn-primary btn-large" href="./pages/preferences.html?ui=review-v2">开始比较你的 Offer<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <section class="mini-home-sheet" aria-labelledby="home-title">
      <div class="mini-home-section-heading"><h2 id="home-title">四步，选清楚</h2><p class="local-storage-note">填写信息保存在本地设备。</p></div>
      <div class="mini-home-route">
        <ol class="mini-home-flow" aria-label="使用流程">
          <li><span class="mini-home-step">01</span><div><strong>说说你的偏好</strong><p>选出你看重的工作与生活因素。</p></div></li>
          <li><span class="mini-home-step">02</span><div><strong>填写你的 Offer</strong><p>录入 2–6 份 Offer，一起比较。</p></div></li>
          <li><span class="mini-home-step">03</span><div><strong>看清差异</strong><p>比较各项优势，帮你做选择。</p></div></li>
          <li><span class="mini-home-step">04</span><div><strong>AI 背调</strong><p>进一步了解第一名公司的公开信息与岗位适配。</p></div></li>
        </ol>
      </div>
    </section>
    <div class="mini-home-footer"><img src="assets/offershow-mascot-paper-v2.png" alt="" width="1313" height="1198"><span><strong>OfferShow</strong> 陪你选一份适合自己的工作</span></div>
  </main>
</div>
<script src="../storage.js"></script>
<script src="scripts/landing-ui.js"></script>
</body>
</html>
